<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hangry Worms</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#120e1c">
<meta name="description" content="Hangry Worms: a pixel-art worm arena. Eat junk food, shoot other worms, fart on your friends.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23120e1c'/%3E%3Ccircle cx='5' cy='10' r='4' fill='%23ffd23f'/%3E%3Ccircle cx='10' cy='7' r='5' fill='%23f08a1c'/%3E%3Crect x='9' y='5' width='2' height='2' fill='%23fff'/%3E%3Crect x='12' y='5' width='2' height='2' fill='%23fff'/%3E%3C/svg%3E">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#120e1c;overflow:hidden;position:fixed;inset:0;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#game{position:absolute;left:0;top:0;display:block}
#ui{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*4);
  background:rgba(14,10,26,.74);overflow:auto;padding:calc(var(--u)*4) max(calc(var(--u)*4),env(safe-area-inset-right)) calc(var(--u)*4) max(calc(var(--u)*4),env(safe-area-inset-left));box-sizing:border-box}
#ui.on{display:flex}
#ui.clear{background:rgba(14,10,26,.5)}
#ui.solid{background:rgba(14,10,26,.93)}
.row{display:flex;flex-direction:row;gap:calc(var(--u)*4);align-items:stretch;justify-content:center;flex-wrap:wrap}
.row.nw{flex-wrap:nowrap;gap:calc(var(--u)*3)}
.col{display:flex;flex-direction:column;gap:calc(var(--u)*3);align-items:center}
.px{display:block;pointer-events:none;flex:none}
.btn{appearance:none;-webkit-appearance:none;background:#2b2147;border:calc(var(--u)*1) solid #ffd23f;border-radius:0;margin:0;cursor:pointer;
  padding:calc(var(--u)*4) calc(var(--u)*8);box-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 #000;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.btn:hover,.btn.focus{background:#4a3a7a;border-color:#fff}
.btn:active{transform:translate(calc(var(--u)*1),calc(var(--u)*1));box-shadow:none}
.btn.alt{border-color:#6d6690;background:#1d1733}
.btn.go{background:#2f7d32;border-color:#b5e61d}
.btn.go:hover,.btn.go.focus{background:#3fa544;border-color:#fff}
.card{flex-direction:column;gap:calc(var(--u)*2);padding:calc(var(--u)*2);border-color:#6d6690;background:#1d1733}
.card.sel{border-color:#ffd23f;background:#4a3a7a}
.panel{background:rgba(20,15,36,.85);border:calc(var(--u)*1) solid #6d6690;padding:calc(var(--u)*4);display:flex;flex-direction:column;gap:calc(var(--u)*2.5);align-items:flex-start}
.panel.c{align-items:center}
input.code{font:bold calc(var(--u)*18) monospace;width:5.2em;text-align:center;text-transform:uppercase;letter-spacing:.2em;background:#120e1c;color:#ffd23f;
  border:calc(var(--u)*1) solid #ffd23f;border-radius:0;padding:calc(var(--u)*3);outline:none;-webkit-user-select:text;user-select:text}
#toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);background:rgba(20,15,36,.92);border:2px solid #ffd23f;padding:8px 12px;display:none;pointer-events:none;z-index:5}
#rotate{position:absolute;inset:0;background:#120e1c;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:9}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<div id="toast"></div>
<div id="rotate"></div>
<script src="sprites.js"></script>
<script src="sim.js"></script>
<script src="bots.js"></script>
<script src="render.js"></script>
<script src="input.js"></script>
<script src="net.js"></script>
<script src="main.js"></script>
</body>
</html>
